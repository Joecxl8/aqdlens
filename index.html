checklistDesc:["Tick an item only after you verify it in your contract. This tracks your review, not legal approval.", "حدد البند بعد التحقق منه في عقدك فقط. هذا تتبع لمراجعتك وليس اعتماداً قانونياً.", "കരാറിൽ പരിശോധിച്ചശേഷം മാത്രം അടയാളപ്പെടുത്തൂ. ഇത് പരിശോധനയുടെ പുരോഗതിയാണ്; നിയമ അംഗീകാരമല്ല.", "अनुबंध में जाँचने के बाद ही टिक करें। यह समीक्षा की प्रगति है, कानूनी मंज़ूरी नहीं।", "চুক্তিতে যাচাইয়ের পরই টিক দিন। এটি পর্যালোচনার অগ্রগতি, আইনি অনুমোদন নয়।", "ஒப்பந்தத்தில் சரிபார்த்த பின் மட்டும் குறிக்கவும். இது ஆய்வின் முன்னேற்றம்; சட்ட ஒப்புதல் அல்ல.", "ಒಪ್ಪಂದದಲ್ಲಿ ಪರಿಶೀಲಿಸಿದ ನಂತರವೇ ಗುರುತಿಸಿ. ಇದು ಪರಿಶೀಲನೆಯ ಪ್ರಗತಿ; ಕಾನೂನು ಅನುಮೋದನೆಯಲ್ಲ."],

hrDesc:["Updates from your audit answers and unchecked contract items. Ask for written clarification before signing.", "تتحدث حسب إجابات الفحص وبنود العقد غير المحددة. اطلب توضيحاً مكتوباً قبل التوقيع.", "പരിശോധന ഉത്തരങ്ങളും പരിശോധിക്കാത്ത കരാർ കാര്യങ്ങളും അനുസരിച്ച് മാറും. ഒപ്പിടുന്നതിനു മുമ്പ് രേഖാമൂലമുള്ള വിശദീകരണം ചോദിക്കൂ.", "जाँच के उत्तर और बिना जाँचे बिंदुओं से बदलते हैं। हस्ताक्षर से पहले लिखित स्पष्टीकरण माँगें।", "যাচাইয়ের উত্তর ও অযাচাইকৃত বিষয় থেকে বদলায়। স্বাক্ষরের আগে লিখিত ব্যাখ্যা চান।", "ஆய்வுப் பதில்கள் மற்றும் சரிபார்க்காத விஷயங்களின்படி மாறும். கையொப்பமிடும் முன் எழுத்துப்பூர்வ விளக்கம் கேளுங்கள்.", "ಪರಿಶೀಲನೆಯ ಉತ್ತರ ಮತ್ತು ಪರಿಶೀಲಿಸದ ಅಂಶಗಳಂತೆ ಬದಲಾಗುತ್ತದೆ. ಸಹಿಯ ಮೊದಲು ಲಿಖಿತ ಸ್ಪಷ್ಟೀಕರಣ ಕೇಳಿ."],

hrWageBasis:["Which fixed allowances will be included in my end-of-service wage, and are any variable components excluded by agreement?", "ما البدلات الثابتة الداخلة في أجر نهاية الخدمة، وهل تُستبعد مكونات متغيرة باتفاق؟", "EOSB വേതനത്തിൽ ഏതെല്ലാം സ്ഥിര അലവൻസുകൾ ഉൾപ്പെടും? ധാരണയോടെ മാറുന്ന ഘടകങ്ങൾ ഒഴിവാക്കുമോ?", "EOSB वेतन में कौन से स्थिर भत्ते शामिल होंगे? क्या समझौते से कोई परिवर्तनीय भाग बाहर है?", "EOSB বেতনে কোন স্থির ভাতা থাকবে? সম্মতিতে কোনো পরিবর্তনশীল অংশ বাদ আছে কি?", "EOSB ஊதியத்தில் எந்த நிலையான படிகள் சேரும்? ஒப்புதலால் மாறும் பகுதிகள் விலக்கப்பட்டுள்ளனவா?", "EOSB ವೇತನದಲ್ಲಿ ಯಾವ ಸ್ಥಿರ ಭತ್ಯೆಗಳು ಸೇರುತ್ತವೆ? ಒಪ್ಪಿಗೆಯಿಂದ ಬದಲಾಗುವ ಭಾಗ ಹೊರಗಿದೆಯೇ?"],

hrPassportConfirm:["Can you confirm my original passport will remain in my possession?", "هل تؤكدون أن جوازي الأصلي سيبقى بحوزتي؟", "അസൽ പാസ്‌പോർട്ട് എന്റെ കൈയിൽ തന്നെ തുടരുമെന്ന് ഉറപ്പാക്കാമോ?", "क्या पुष्टि करेंगे कि मूल पासपोर्ट मेरे पास रहेगा?", "আসল পাসপোর্ট আমার কাছে থাকবে কি?", "அசல் கடவுச்சீட்டு என்னிடம் இருக்கும் என்பதை உறுதிப்படுத்த முடியுமா?", "ಮೂಲ ಪಾಸ್‌ಪೋರ್ಟ್ ನನ್ನಲ್ಲೇ ಇರುತ್ತದೆ ಎಂದು ದೃಢೀಕರಿಸುವಿರಾ?"],
hrProbationFix:["Can you correct the probation clause to comply with Article 53’s 180-day cap and explain excluded days?", "هل تصححون بند التجربة ليتفق مع حد 180 يوماً بالمادة 53 وتوضحون الأيام المستبعدة؟", "പ്രൊബേഷൻ വ്യവസ്ഥ ആർട്ടിക്കിൾ 53ലെ 180 ദിവസ പരിധിയോട് പൊരുത്തപ്പെടുത്തി ഒഴിവാക്കുന്ന ദിവസങ്ങൾ വിശദീകരിക്കാമോ?", "क्या परिवीक्षा खंड अनुच्छेद 53 की 180 दिन सीमा के अनुसार सुधारकर अपवर्जित दिन बताएँगे?", "পরীক্ষাকালের শর্ত অনুচ্ছেদ ৫৩-এর ১৮০ দিনের সীমা অনুযায়ী ঠিক করে বাদ দেওয়া দিন ব্যাখ্যা করবেন?", "சோதனைக்கால நிபந்தனையை பிரிவு 53ன் 180 நாள் வரம்புக்கேற்ப திருத்தி விலக்கப்படும் நாட்களை விளக்க முடியுமா?", "ಪರೀಕ್ಷಾ ಅವಧಿಯ ಷರತ್ತು ವಿಧಿ 53ರ 180 ದಿನದ ಮಿತಿಗೆ ಸರಿಪಡಿಸಿ ಹೊರಗಿಟ್ಟ ದಿನ ವಿವರಿಸುವಿರಾ?"],

defBasic:["The agreed pay for your work, before separately listed allowances; the legal definition also covers periodic increments.", "الأجر المتفق عليه مقابل عملك قبل البدلات المنفصلة؛ ويشمل التعريف النظامي العلاوات الدورية.", "പ്രത്യേക അലവൻസുകൾക്ക് മുമ്പുള്ള ജോലിക്കുള്ള നിശ്ചിത വേതനം; നിയമ നിർവചനത്തിൽ കാലാനുസൃത വർധനകളും ഉൾപ്പെടും.", "अलग भत्तों से पहले काम का तय वेतन; कानूनी परिभाषा में नियमित वेतन वृद्धि भी शामिल है।", "আলাদা ভাতার আগে কাজের নির্ধারিত বেতন; আইনি সংজ্ঞায় নিয়মিত বৃদ্ধি অন্তর্ভুক্ত।", "தனியாகக் குறிப்பிடும் படிகளுக்கு முன் ஒப்புக்கொண்ட ஊதியம்; சட்ட வரையறையில் காலமுறை உயர்வுகளும் அடங்கும்.", "ಪ್ರತ್ಯೇಕ ಭತ್ಯೆಗಳ ಮೊದಲು ಒಪ್ಪಿದ ಕೆಲಸದ ವೇತನ; ಕಾನೂನು ವ್ಯಾಖ್ಯಾನದಲ್ಲಿ ನಿಯತ ಹೆಚ್ಚಳವೂ ಸೇರಿದೆ."],
defAllow:["Additional pay or benefits, such as housing or transport. Fixed contractual allowances can count toward eligible wage.", "أجر أو مزايا إضافية كالسكن أو النقل. قد تدخل البدلات التعاقدية الثابتة ضمن الأجر المستحق.", "വീട്, യാത്ര തുടങ്ങിയ അധിക വേതനമോ ആനുകൂല്യമോ. സ്ഥിര കരാർ അലവൻസുകൾ അർഹമായ വേതനത്തിൽ ഉൾപ്പെടാം.", "आवास या परिवहन जैसे अतिरिक्त वेतन या लाभ। स्थिर अनुबंध भत्ते पात्र वेतन में शामिल हो सकते हैं।", "আবাসন বা যাতায়াতের মতো অতিরিক্ত অর্থ বা সুবিধা। স্থির চুক্তিভিত্তিক ভাতা যোগ্য বেতনে গণ্য হতে পারে।", "வீடு அல்லது போக்குவரத்து போன்ற கூடுதல் ஊதியம் அல்லது பலன்கள். நிலையான ஒப்பந்தப் படிகள் தகுதி ஊதியத்தில் சேரலாம்.", "ವಸತಿ ಅಥವಾ ಸಾರಿಗೆಯಂತಹ ಹೆಚ್ಚುವರಿ ವೇತನ ಅಥವಾ ಸೌಲಭ್ಯ. ಸ್ಥಿರ ಒಪ್ಪಂದದ ಭತ್ಯೆಗಳು ಅರ್ಹ ವೇತನದಲ್ಲಿ ಸೇರಬಹುದು."],
defWage:["The wage used to calculate a benefit. For EOSB, verify your last actual wage and any permitted variable-pay exclusions.", "الأجر المستخدم لحساب الاستحقاق. لنهاية الخدمة، تحقق من أجرك الفعلي الأخير والاستبعادات الجائزة للأجر المتغير.", "ആനുകൂല്യം കണക്കാക്കാനുള്ള വേതനം. EOSBക്കായി അവസാന യഥാർത്ഥ വേതനവും അനുവദിച്ച മാറുന്ന വേതന ഒഴിവുകളും പരിശോധിക്കൂ.", "लाभ की गणना का वेतन। EOSB के लिए अंतिम वास्तविक वेतन और अनुमत परिवर्तनीय वेतन अपवर्जन जाँचें।", "সুবিধা গণনার বেতন। EOSB-এর জন্য শেষ প্রকৃত বেতন ও অনুমোদিত পরিবর্তনশীল বেতন বাদ দেওয়া যাচাই করুন।", "பலன் கணக்கிடும் ஊதியம். EOSBக்கு கடைசி உண்மையான ஊதியம் மற்றும் அனுமதிக்கப்பட்ட மாறும் ஊதிய விலக்குகளைச் சரிபார்க்கவும்.", "ಸೌಲಭ್ಯ ಲೆಕ್ಕಾಚಾರದ ವೇತನ. EOSBಗೆ ಕೊನೆಯ ನಿಜವಾದ ವೇತನ ಮತ್ತು ಅನುಮತಿಸಲಾದ ಬದಲಾಗುವ ವೇತನದ ಹೊರಗಿಡುವಿಕೆ ಪರಿಶೀಲಿಸಿ."],
eosbTerm:["End-of-service benefit (EOSB)", "مكافأة نهاية الخدمة", "സേവനാവസാന ആനുകൂല്യം (EOSB)", "सेवा समाप्ति लाभ (EOSB)", "চাকরি শেষের সুবিধা (EOSB)", "பணிக்கால முடிவுப் பலன் (EOSB)", "ಸೇವಾಂತ್ಯ ಸೌಲಭ್ಯ (EOSB)"],
defEosb:["An award payable at an eligible end of employment. Wage, completed service and the separation reason affect the amount.", "مكافأة عند انتهاء علاقة عمل مستحقة. يتأثر مبلغها بالأجر ومدة الخدمة وسبب الانتهاء.", "അർഹമായ സേവനാവസാനത്തിൽ നൽകുന്ന തുക. വേതനം, പൂർത്തിയായ സേവനം, അവസാനിക്കുന്ന കാരണം എന്നിവ തുകയെ ബാധിക്കും.", "पात्र सेवा समाप्ति पर देय राशि। वेतन, पूरी सेवा और समाप्ति का कारण राशि को प्रभावित करते हैं।", "যোগ্য চাকরি সমাপ্তিতে প্রাপ্য অর্থ। বেতন, সম্পূর্ণ মেয়াদ ও চাকরি শেষের কারণ পরিমাণে প্রভাব ফেলে।", "தகுதியான பணி முடிவில் வழங்கப்படும் தொகை. ஊதியம், நிறைவு சேவை மற்றும் முடிவுக் காரணம் தொகையைப் பாதிக்கும்.", "ಅರ್ಹ ಸೇವಾ ಮುಕ್ತಾಯದಲ್ಲಿ ಪಾವತಿಸುವ ಮೊತ್ತ. ವೇತನ, ಪೂರ್ಣ ಸೇವೆ ಮತ್ತು ಬೇರ್ಪಡೆಯ ಕಾರಣ ಮೊತ್ತದ ಮೇಲೆ ಪರಿಣಾಮ ಬೀರುತ್ತವೆ."],
probationTerm:["Probation", "فترة التجربة", "പ്രൊബേഷൻ", "परिवीक्षा", "পরীক্ষাকাল", "சோதனைக்காலம்", "ಪರೀಕ್ಷಾ ಅವಧಿ"],
defProbation:["A trial period expressly stated in the contract, capped at 180 counted days under Article 53. Some leave is excluded by regulation.", "فترة تجربة منصوص عليها صراحة بالعقد، حدها 180 يوماً محتسباً وفق المادة 53. تستبعد اللائحة بعض الإجازات.", "കരാറിൽ വ്യക്തമായി പറയുന്ന പരീക്ഷണ കാലം; ആർട്ടിക്കിൾ 53 പ്രകാരം പരമാവധി 180 കണക്കാക്കുന്ന ദിവസങ്ങൾ. ചട്ടങ്ങൾ ചില അവധികൾ ഒഴിവാക്കുന്നു.", "अनुबंध में स्पष्ट परीक्षण अवधि, अनुच्छेद 53 के तहत अधिकतम 180 गणनीय दिन। नियम कुछ छुट्टियाँ बाहर रखते हैं।", "চুক্তিতে স্পষ্ট পরীক্ষার সময়, অনুচ্ছেদ ৫৩-তে সর্বোচ্চ ১৮০ গণনাযোগ্য দিন। বিধিতে কিছু ছুটি বাদ যায়।", "ஒப்பந்தத்தில் வெளிப்படையான சோதனைக்காலம்; பிரிவு 53ன்படி அதிகபட்சம் 180 கணக்கிடப்படும் நாட்கள். சில விடுமுறைகள் விதிகளால் விலக்கப்படும்.", "ಒಪ್ಪಂದದಲ್ಲಿ ಸ್ಪಷ್ಟವಾದ ಪರೀಕ್ಷಾ ಅವಧಿ; ವಿಧಿ 53 ಪ್ರಕಾರ ಗರಿಷ್ಠ 180 ಎಣಿಕೆಯ ದಿನಗಳು. ನಿಯಮ ಕೆಲವು ರಜೆ ಹೊರಗಿಡುತ್ತದೆ."],
qiwaTerm:["Qiwa", "قوى", "Qiwa", "Qiwa", "Qiwa", "Qiwa", "Qiwa"],
defQiwa:["Saudi Arabia’s labor-market platform, including employment-contract services. AqdLens does not access or authenticate your Qiwa contract.", "منصة سوق العمل السعودية، وتشمل خدمات عقود العمل. لا يصل AqdLens إلى عقدك في قوى ولا يوثقه.", "തൊഴിൽ കരാർ സേവനങ്ങൾ ഉൾപ്പെടുന്ന സൗദിയുടെ തൊഴിൽ വിപണി പ്ലാറ്റ്ഫോം. AqdLens നിങ്ങളുടെ Qiwa കരാർ ആക്സസ് ചെയ്യുകയോ സ്ഥിരീകരിക്കുകയോ ചെയ്യുന്നില്ല.", "सऊदी श्रम-बाज़ार मंच, जिसमें रोजगार अनुबंध सेवाएँ हैं। AqdLens आपका Qiwa अनुबंध नहीं देखता या प्रमाणित करता।", "সৌদি শ্রমবাজারের প্ল্যাটফর্ম, কর্মচুক্তির সেবাসহ। AqdLens আপনার Qiwa চুক্তি পড়ে বা প্রমাণিত করে না।", "வேலை ஒப்பந்தச் சேவைகளைக் கொண்ட சவுதி தொழிலாளர் சந்தைத் தளம். AqdLens உங்கள் Qiwa ஒப்பந்தத்தை அணுகவோ அங்கீகரிக்கவோ செய்யாது.", "ಉದ್ಯೋಗ ಒಪ್ಪಂದ ಸೇವೆಗಳಿರುವ ಸೌದಿ ಕಾರ್ಮಿಕ ಮಾರುಕಟ್ಟೆ ವೇದಿಕೆ. AqdLens ನಿಮ್ಮ Qiwa ಒಪ್ಪಂದ ಪ್ರವೇಶಿಸುವುದಿಲ್ಲ ಅಥವಾ ದೃಢೀಕರಿಸುವುದಿಲ್ಲ."],

helpDesc:["Use official channels for your specific situation. These links open external services.", "استخدم القنوات الرسمية لحالتك. تفتح هذه الروابط خدمات خارجية.", "നിങ്ങളുടെ സാഹചര്യത്തിന് ഔദ്യോഗിക സേവനങ്ങൾ ഉപയോഗിക്കൂ. ലിങ്കുകൾ പുറം സേവനങ്ങളിലേക്കാണ്.", "अपनी स्थिति के लिए आधिकारिक माध्यम लें। लिंक बाहरी सेवाएँ खोलते हैं।", "আপনার অবস্থার জন্য সরকারি মাধ্যম ব্যবহার করুন। লিংক বাহ্যিক সেবা খোলে।", "உங்கள் நிலைக்கு அதிகாரப்பூர்வ வழிகளைப் பயன்படுத்தவும். இணைப்புகள் வெளிச் சேவைகளைத் திறக்கும்.", "ನಿಮ್ಮ ಪರಿಸ್ಥಿತಿಗೆ ಅಧಿಕೃತ ಮಾರ್ಗ ಬಳಸಿ. ಲಿಂಕ್‌ಗಳು ಹೊರಗಿನ ಸೇವೆ ತೆರೆಯುತ್ತವೆ."],

feedbackPrivacy:["Opens a draft to Joe Manu Thomas. You review and send it in your email app. Your calculations are not attached. No feedback is sent automatically.", "تُفتح مسودة إلى جو مانو توماس. راجعها وأرسلها بتطبيق بريدك. لا تُرفق حساباتك، ولا تُرسل الملاحظات تلقائياً.", "ജോ മനു തോമസിന് ഡ്രാഫ്റ്റ് തുറക്കും. ഇമെയിൽ ആപ്പിൽ പരിശോധിച്ച് അയയ്ക്കൂ. കണക്കുകൾ ചേർക്കില്ല. അഭിപ്രായം സ്വയം അയയ്ക്കില്ല.", "जो मनु थॉमस को ड्राफ्ट खुलेगा। अपने ईमेल ऐप में जाँचकर भेजें। गणनाएँ संलग्न नहीं हैं। प्रतिक्रिया अपने आप नहीं भेजी जाती।", "জো মানু থমাসকে খসড়া খুলবে। আপনার ইমেইল অ্যাপে দেখে পাঠান। গণনা যুক্ত হয় না। মতামত স্বয়ংক্রিয়ভাবে পাঠানো হয় না।", "ஜோ மனு தாமஸுக்கு வரைவு திறக்கும். உங்கள் மின்னஞ்சல் பயன்பாட்டில் சரிபார்த்து அனுப்பவும். கணக்குகள் இணைக்கப்படாது. கருத்து தானாக அனுப்பப்படாது.", "ಜೋ ಮನು ಥಾಮಸ್‌ಗೆ ಕರಡು ತೆರೆಯುತ್ತದೆ. ನಿಮ್ಮ ಇಮೇಲ್ ಆ್ಯಪ್‌ನಲ್ಲಿ ಪರಿಶೀಲಿಸಿ ಕಳುಹಿಸಿ. ಲೆಕ್ಕಾಚಾರಗಳು ಲಗತ್ತಾಗುವುದಿಲ್ಲ. ಅಭಿಪ್ರಾಯ ಸ್ವಯಂ ಕಳುಹಿಸುವುದಿಲ್ಲ."],

feedbackCopied:["Feedback copied. Paste it into an email when ready.", "تم النسخ. الصق الملاحظة في بريد عندما تكون جاهزاً.", "പകർത്തി. തയ്യാറാകുമ്പോൾ ഇമെയിലിൽ ചേർക്കൂ.", "प्रतिक्रिया कॉपी हुई। तैयार होने पर ईमेल में पेस्ट करें।", "মতামত কপি হয়েছে। প্রস্তুত হলে ইমেইলে পেস্ট করুন।", "கருத்து நகலெடுக்கப்பட்டது. தயாரானதும் மின்னஞ்சலில் ஒட்டவும்.", "ಅಭಿಪ್ರಾಯ ನಕಲಿಸಲಾಗಿದೆ. ಸಿದ್ಧವಾದಾಗ ಇಮೇಲ್‌ಗೆ ಅಂಟಿಸಿ."],
feedbackCopyFailed:["Copy unavailable. Download the text or select and copy your message.", "النسخ غير متاح. نزّل النص أو حدده وانسخه.", "പകർത്താനാവില്ല. ടെക്സ്റ്റ് ഡൗൺലോഡ് ചെയ്യൂ അല്ലെങ്കിൽ തിരഞ്ഞെടുത്ത് പകർത്തൂ.", "कॉपी उपलब्ध नहीं। टेक्स्ट डाउनलोड करें या संदेश चुनकर कॉपी करें।", "কপি সম্ভব নয়। টেক্সট ডাউনলোড বা বার্তা নির্বাচন করে কপি করুন।", "நகலெடுக்க இயலவில்லை. உரையைப் பதிவிறக்கவும் அல்லது தேர்ந்தெடுத்து நகலெடுக்கவும்.", "ನಕಲು ಲಭ್ಯವಿಲ್ಲ. ಪಠ್ಯ ಡೌನ್‌ಲೋಡ್ ಅಥವಾ ಆಯ್ಕೆ ಮಾಡಿ ನಕಲಿಸಿ."],
feedbackDraftOpened:["Email draft requested. If no email app opens, copy or download your feedback and email it to joemanuthomas@gmail.com.", "طُلب فتح مسودة. إن لم يفتح تطبيق البريد، انسخ أو نزّل ملاحظتك وأرسلها إلى joemanuthomas@gmail.com.", "ഡ്രാഫ്റ്റ് തുറക്കാൻ ആവശ്യപ്പെട്ടു. ആപ്പ് തുറന്നില്ലെങ്കിൽ പകർത്തിയോ ഡൗൺലോഡ് ചെയ്തോ joemanuthomas@gmail.com ലേക്ക് അയയ്ക്കൂ.", "ईमेल ड्राफ्ट का अनुरोध किया। ऐप न खुले तो कॉपी या डाउनलोड करके joemanuthomas@gmail.com पर भेजें।", "খসড়া খোলার অনুরোধ করা হয়েছে। অ্যাপ না খুললে কপি বা ডাউনলোড করে joemanuthomas@gmail.com-এ পাঠান।", "வரைவு கோரப்பட்டது. மின்னஞ்சல் பயன்பாடு திறக்காவிட்டால் நகலெடுத்து அல்லது பதிவிறக்கி joemanuthomas@gmail.com க்கு அனுப்பவும்.", "ಇಮೇಲ್ ಕರಡು ಕೇಳಲಾಗಿದೆ. ಆ್ಯಪ್ ತೆರೆಯದಿದ್ದರೆ ನಕಲಿಸಿ ಅಥವಾ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ joemanuthomas@gmail.com ಗೆ ಕಳುಹಿಸಿ."],
feedbackDownloaded:["Feedback text downloaded. Nothing has been sent.", "تم تنزيل النص. لم يُرسل شيء.", "ടെക്സ്റ്റ് ഡൗൺലോഡ് ചെയ്തു. ഒന്നും അയച്ചിട്ടില്ല.", "प्रतिक्रिया डाउनलोड हुई। कुछ भेजा नहीं गया।", "মতামত ডাউনলোড হয়েছে। কিছু পাঠানো হয়নি।", "கருத்து பதிவிறக்கப்பட்டது. எதுவும் அனுப்பப்படவில்லை.", "ಅಭಿಪ್ರಾಯ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ. ಏನನ್ನೂ ಕಳುಹಿಸಲಾಗಿಲ್ಲ."],

privacyDetail:["AqdLens calculates locally and saves only your language preference on this device. Fonts and styling load from external providers; official links and your email app have their own privacy policies. PDF files are saved wherever you choose. This utility does not file complaints or verify contracts.", "يحسب AqdLens محلياً ويحفظ فقط تفضيل اللغة على جهازك. تُحمّل الخطوط والتنسيق من جهات خارجية؛ للروابط الرسمية وتطبيق البريد سياسات خصوصية خاصة. تحفظ PDF في المكان الذي تختاره. لا تقدم الأداة شكاوى ولا تتحقق من العقود.", "AqdLens പ്രാദേശികമായി കണക്കാക്കുന്നു; ഈ ഉപകരണത്തിൽ ഭാഷ മാത്രം സേവ് ചെയ്യുന്നു. ഫോണ്ടും സ്റ്റൈലും പുറം സേവനങ്ങളിൽ നിന്നാണ്. ഔദ്യോഗിക ലിങ്കുകൾക്കും ഇമെയിൽ ആപ്പിനും സ്വന്തം സ്വകാര്യതാ നയങ്ങളുണ്ട്. PDF നിങ്ങൾ തിരഞ്ഞെടുക്കുന്നിടത്ത് സേവ് ചെയ്യും. പരാതി നൽകുകയോ കരാർ സ്ഥിരീകരിക്കുകയോ ചെയ്യില്ല.", "AqdLens स्थानीय गणना करता है और डिवाइस पर केवल भाषा पसंद सहेजता है। फ़ॉन्ट और स्टाइल बाहरी सेवाओं से आते हैं; आधिकारिक लिंक और ईमेल ऐप की अपनी नीतियाँ हैं। PDF आपके चुने स्थान पर सहेजी जाती है। यह शिकायत नहीं दर्ज करता या अनुबंध सत्यापित करता।", "AqdLens স্থানীয়ভাবে গণনা করে এবং ডিভাইসে শুধু ভাষার পছন্দ রাখে। ফন্ট ও স্টাইল বাহ্যিক সেবা থেকে আসে; সরকারি লিংক ও ইমেইল অ্যাপের নিজস্ব নীতি আছে। PDF আপনার পছন্দের স্থানে সংরক্ষিত হয়। এটি অভিযোগ দায়ের বা চুক্তি যাচাই করে না।", "AqdLens உள்ளூரில் கணக்கிட்டு சாதனத்தில் மொழி விருப்பத்தை மட்டும் சேமிக்கிறது. எழுத்துரு மற்றும் பாணி வெளிச் சேவைகளிலிருந்து வரும்; அதிகாரப்பூர்வ இணைப்புகள் மற்றும் மின்னஞ்சல் பயன்பாட்டிற்கு தனிக் கொள்கைகள் உள்ளன. PDF நீங்கள் தேர்ந்த இடத்தில் சேமிக்கப்படும். இது புகாரளிக்கவோ ஒப்பந்தம் சரிபார்க்கவோ செய்யாது.", "AqdLens ಸ್ಥಳೀಯವಾಗಿ ಲೆಕ್ಕಿಸಿ ಸಾಧನದಲ್ಲಿ ಭಾಷೆಯ ಆಯ್ಕೆ ಮಾತ್ರ ಉಳಿಸುತ್ತದೆ. ಫಾಂಟ್ ಮತ್ತು ಶೈಲಿ ಹೊರಗಿನ ಸೇವೆಗಳಿಂದ ಬರುತ್ತವೆ; ಅಧಿಕೃತ ಲಿಂಕ್ ಮತ್ತು ಇಮೇಲ್ ಆ್ಯಪ್‌ಗೆ ತಮ್ಮದೇ ನೀತಿ ಇದೆ. PDF ನೀವು ಆರಿಸಿದ ಸ್ಥಳದಲ್ಲಿ ಉಳಿಯುತ್ತದೆ. ಇದು ದೂರು ದಾಖಲಿಸುವುದಿಲ್ಲ ಅಥವಾ ಒಪ್ಪಂದ ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ."],

nameOrigin:["The name AqdLens combines ʿaqd (عقد), the Arabic word for “contract,” with the English word “lens.” It reflects our goal: helping workers see their contracts clearly and understand their rights before taking the next step.", "يجمع اسم AqdLens بين كلمة «عقد» العربية وكلمة «Lens» الإنجليزية التي تعني «عدسة». ويعكس هدفنا: مساعدة العمال على رؤية عقودهم بوضوح وفهم حقوقهم قبل اتخاذ الخطوة التالية.", "AqdLens എന്ന പേര് കരാർ എന്നർഥമുള്ള അറബി വാക്കായ ʿaqd (عقد), ഇംഗ്ലീഷ് വാക്കായ lens എന്നിവ ചേർന്നതാണ്. തൊഴിലാളികൾക്ക് കരാറുകൾ വ്യക്തമായി മനസ്സിലാക്കാനും അടുത്ത ചുവടിന് മുമ്പ് അവകാശങ്ങൾ അറിയാനും സഹായിക്കുക എന്നതാണ് ഇതിന്റെ ആശയം.", "AqdLens नाम अरबी शब्द ʿaqd (عقد), जिसका अर्थ “अनुबंध” है, और अंग्रेज़ी शब्द “lens” को जोड़ता है। यह हमारे उद्देश्य को दर्शाता है: कामगारों को अपना अनुबंध स्पष्ट रूप से समझने और अगला कदम उठाने से पहले अपने अधिकार जानने में मदद करना।", "AqdLens নামটি “চুক্তি” অর্থের আরবি শব্দ ʿaqd (عقد) এবং ইংরেজি শব্দ “lens” মিলিয়ে তৈরি। এটি আমাদের লক্ষ্য বোঝায়: কর্মীদের চুক্তি স্পষ্টভাবে বুঝতে এবং পরের পদক্ষেপের আগে নিজেদের অধিকার জানতে সাহায্য করা।", "AqdLens என்ற பெயர் “ஒப்பந்தம்” என்று பொருள்படும் அரபுச் சொல்லான ʿaqd (عقد) மற்றும் ஆங்கிலச் சொல்லான “lens” ஆகியவற்றை இணைக்கிறது. தொழிலாளர்கள் தங்கள் ஒப்பந்தத்தைத் தெளிவாகப் புரிந்துகொண்டு அடுத்த படிக்கு முன் உரிமைகளை அறிய உதவுவதே இதன் நோக்கம்.", "AqdLens ಎಂಬ ಹೆಸರು “ಒಪ್ಪಂದ” ಎಂಬ ಅರ್ಥದ ಅರೇಬಿಕ್ ಪದ ʿaqd (عقد) ಮತ್ತು ಇಂಗ್ಲಿಷ್ ಪದ “lens” ಅನ್ನು ಸಂಯೋಜಿಸುತ್ತದೆ. ಕಾರ್ಮಿಕರು ತಮ್ಮ ಒಪ್ಪಂದಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಅರ್ಥಮಾಡಿಕೊಂಡು ಮುಂದಿನ ಹೆಜ್ಜೆಯ ಮೊದಲು ಹಕ್ಕುಗಳನ್ನು ತಿಳಿಯಲು ನೆರವಾಗುವುದು ಇದರ ಉದ್ದೇಶ."],
aboutTitle:['About Us','من نحن','ഞങ്ങളെക്കുറിച്ച്','हमारे बारे में','আমাদের সম্পর্কে','எங்களைப் பற்றி','ನಮ್ಮ ಬಗ್ಗೆ'],
aboutText:['Created by Joe Manu Thomas, a CSE student who grew up in Saudi Arabia, AqdLens helps expatriate workers understand their salary, employment benefits, and contract risks through simple, multilingual tools.','أنشأ عقد لينس جو مانو توماس، طالب هندسة علوم الحاسب الذي نشأ في السعودية. يساعد عقد لينس العمال الوافدين على فهم رواتبهم ومزاياهم الوظيفية ومخاطر عقودهم من خلال أدوات بسيطة ومتعددة اللغات.','സൗദി അറേബ്യയിൽ വളർന്ന CSE വിദ്യാർത്ഥിയായ ജോ മനു തോമസ് സൃഷ്ടിച്ച AqdLens, ലളിതമായ ബഹുഭാഷാ ടൂളുകളിലൂടെ പ്രവാസി തൊഴിലാളികൾക്ക് ശമ്പളം, തൊഴിൽ ആനുകൂല്യങ്ങൾ, കരാറിലെ അപകടങ്ങൾ എന്നിവ മനസ്സിലാക്കാൻ സഹായിക്കുന്നു.','सऊदी अरब में पले-बढ़े CSE छात्र जो मनु थॉमस द्वारा बनाया गया AqdLens, सरल बहुभाषी टूल के माध्यम से प्रवासी कामगारों को वेतन, रोजगार लाभ और अनुबंध के जोखिम समझने में मदद करता है।','সৌদি আরবে বেড়ে ওঠা CSE শিক্ষার্থী জো মানু থমাসের তৈরি AqdLens, সহজ বহুভাষিক টুলের মাধ্যমে প্রবাসী কর্মীদের বেতন, চাকরির সুবিধা ও চুক্তির ঝুঁকি বুঝতে সাহায্য করে।','சவுதி அரேபியாவில் வளர்ந்த CSE மாணவர் ஜோ மனு தாமஸ் உருவாக்கிய AqdLens, எளிய பன்மொழிக் கருவிகள் மூலம் வெளிநாட்டுத் தொழிலாளர்கள் தங்கள் சம்பளம், வேலைச் சலுகைகள் மற்றும் ஒப்பந்த அபாயங்களைப் புரிந்துகொள்ள உதவுகிறது.','ಸೌದಿ ಅರೇಬಿಯಾದಲ್ಲಿ ಬೆಳೆದ CSE ವಿದ್ಯಾರ್ಥಿ ಜೋ ಮನು ಥಾಮಸ್ ರಚಿಸಿದ AqdLens, ಸರಳ ಬಹುಭಾಷಾ ಸಾಧನಗಳ ಮೂಲಕ ವಲಸಿಗ ಕಾರ್ಮಿಕರಿಗೆ ವೇತನ, ಉದ್ಯೋಗ ಸೌಲಭ್ಯಗಳು ಮತ್ತು ಒಪ್ಪಂದದ ಅಪಾಯಗಳನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಸಹಾಯ ಮಾಡುತ್ತದೆ.'],

headline:['Know your contract. Protect your future.','افهم عقدك. احمِ مستقبلك.','കരാർ മനസ്സിലാക്കൂ. ഭാവി സംരക്ഷിക്കൂ.','अपना अनुबंध समझें। अपना भविष्य सुरक्षित करें।','চুক্তি বুঝুন। ভবিষ্যৎ সুরক্ষিত রাখুন।','ஒப்பந்தத்தை அறியுங்கள். எதிர்காலத்தைப் பாதுகாக்கவும்.','ಒಪ್ಪಂದ ತಿಳಿಯಿರಿ. ಭವಿಷ್ಯ ರಕ್ಷಿಸಿರಿ.'],
intro:['A clearer view of your salary, end-of-service benefits and contract risks.','رؤية أوضح لراتبك ومكافأة نهاية الخدمة ومخاطر عقدك.','ശമ്പളം, സേവനാവസാന ആനുകൂല്യം, കരാറിലെ അപകടങ്ങൾ എന്നിവ വ്യക്തമായി അറിയൂ.','वेतन, सेवा समाप्ति लाभ और अनुबंध के जोखिम समझें।','বেতন, চাকরি শেষের সুবিধা ও চুক্তির ঝুঁকি বুঝুন।','சம்பளம், பணிக்கால முடிவுப் பலன், ஒப்பந்த அபாயங்களை அறியவும்.','ವೇತನ, ಸೇವಾಂತ್ಯ ಸೌಲಭ್ಯ ಮತ್ತು ಒಪ್ಪಂದದ ಅಪಾಯಗಳನ್ನು ತಿಳಿಯಿರಿ.'],

structureDesc:['Same package. Different split. See what changes.','نفس الراتب الإجمالي، توزيع مختلف. شاهد الأثر.','ഒരേ മൊത്തം ശമ്പളം. വ്യത്യസ്ത വിഭജനം. ഫലം കാണൂ.','कुल वेतन समान, विभाजन अलग। असर देखें।','মোট বেতন একই, বিভাজন আলাদা। প্রভাব দেখুন।','ஒரே மொத்தச் சம்பளம். வேறு பிரிவு. மாற்றத்தைக் காணவும்.','ಒಂದೇ ಒಟ್ಟು ವೇತನ. ವಿಭಜನೆ ಬೇರೆ. ಪರಿಣಾಮ ನೋಡಿ.'],

benchmarkTitle:['A benchmark, not a legal minimum','مؤشر للمقارنة، وليس حداً قانونياً','താരതമ്യ മാനദണ്ഡം; നിയമപരമായ മിനിമം അല്ല','तुलना का मानक, कानूनी न्यूनतम नहीं','তুলনার মানদণ্ড, আইনি ন্যূনতম নয়','ஒப்பீட்டு அளவுகோல்; சட்டக் குறைந்தபட்சம் அல்ல','ಹೋಲಿಕೆಯ ಮಾನದಂಡ; ಕಾನೂನು ಕನಿಷ್ಠವಲ್ಲ'],
benchmarkNote:['70% basic is an illustrative negotiation benchmark. Saudi Labor Law does not require this ratio. A low basic salary alone is not a violation.','الأساسي بنسبة 70% مؤشر تفاوضي افتراضي. نظام العمل لا يفرض هذه النسبة، وانخفاض الأساسي وحده ليس مخالفة.','70% അടിസ്ഥാന വിഹിതം ചർച്ചയ്ക്കുള്ള ഉദാഹരണമാണ്. സൗദി നിയമം ഈ അനുപാതം നിർബന്ധമാക്കുന്നില്ല. കുറഞ്ഞ അടിസ്ഥാന ശമ്പളം മാത്രം നിയമലംഘനമല്ല.','70% मूल वेतन बातचीत का उदाहरण है। सऊदी कानून यह अनुपात अनिवार्य नहीं करता। कम मूल वेतन अपने आप उल्लंघन नहीं है।','৭০% মূল বেতন আলোচনার উদাহরণ। সৌদি আইন এই অনুপাত বাধ্যতামূলক করে না। কম মূল বেতন নিজে লঙ্ঘন নয়।','70% அடிப்படை என்பது பேச்சுவார்த்தைக்கான எடுத்துக்காட்டு. சவுதி சட்டம் இந்த விகிதத்தைக் கட்டாயப்படுத்தாது. குறைந்த அடிப்படை மட்டும் சட்டமீறல் அல்ல.','70% ಮೂಲ ವೇತನ ಮಾತುಕತೆಗೆ ಉದಾಹರಣೆ. ಸೌದಿ ಕಾನೂನು ಈ ಅನುಪಾತ ಕಡ್ಡಾಯಗೊಳಿಸುವುದಿಲ್ಲ. ಕಡಿಮೆ ಮೂಲ ವೇತನ ಮಾತ್ರ ಉಲ್ಲಂಘನೆಯಲ್ಲ.'],

compareDesc:['Compare your offer with a 70% basic salary benchmark.','قارن عرضك بمؤشر أساسي قدره 70%.','നിങ്ങളുടെ ഓഫർ 70% അടിസ്ഥാന വിഹിതവുമായി താരതമ്യം ചെയ്യൂ.','अपने प्रस्ताव की 70% मूल वेतन से तुलना करें।','আপনার প্রস্তাবের সঙ্গে ৭০% মূল বেতনের তুলনা করুন।','உங்கள் சலுகையை 70% அடிப்படையுடன் ஒப்பிடவும்.','ನಿಮ್ಮ ಕೊಡುಗೆಯನ್ನು 70% ಮೂಲ ವೇತನದೊಂದಿಗೆ ಹೋಲಿಸಿ.'],

otLossDesc:['Against the 70% benchmark. A negative value means your rate is higher.','مقارنة بمؤشر 70%. القيمة السالبة تعني أن أجرك أعلى.','70% മാനദണ്ഡവുമായി താരതമ്യം. നെഗറ്റീവ് മൂല്യം നിങ്ങളുടെ നിരക്ക് കൂടുതലെന്ന് സൂചിപ്പിക്കുന്നു.','70% मानक की तुलना में। ऋणात्मक मान अधिक दर दर्शाता है।','৭০% মানদণ্ডের তুলনায়। ঋণাত্মক মান বেশি হার বোঝায়।','70% அளவுகோலுடன் ஒப்பீடு. எதிர்மறை மதிப்பு அதிக ஊதியத்தைக் குறிக்கும்.','70% ಮಾನದಂಡಕ್ಕೆ ಹೋಲಿಕೆ. ಋಣಾತ್ಮಕ ಮೌಲ್ಯ ಹೆಚ್ಚು ದರವನ್ನು ಸೂಚಿಸುತ್ತದೆ.'],
legalEosb:['5-year eligible-wage EOSB','مكافأة 5 سنوات بالأجر المستحق','5 വർഷത്തെ അർഹമായ EOSB','5 वर्ष का पात्र वेतन EOSB','৫ বছরের যোগ্য বেতন EOSB','5 ஆண்டு தகுதி ஊதிய EOSB','5 ವರ್ಷದ ಅರ್ಹ ವೇತನದ EOSB'],
legalFiveDesc:['Same for both splits if all fixed allowances qualify. Full-rate separation.','متساوية في التوزيعين إذا شملت البدلات الثابتة المستحقة. انتهاء بأجر كامل.','സ്ഥിര അലവൻസുകൾ അർഹമാണെങ്കിൽ രണ്ടിലും ഒരേ തുക. പൂർണ്ണ ആനുകൂല്യ നിരക്ക്.','पात्र स्थिर भत्तों सहित दोनों में समान। पूर्ण दर पर अलगाव।','স্থির ভাতা যোগ্য হলে উভয়ে একই। পূর্ণ হারে চাকরি শেষ।','நிலையான படிகள் தகுதியானால் இரண்டிலும் சமம். முழு விகிதப் பிரிவு.','ಸ್ಥಿರ ಭತ್ಯೆಗಳು ಅರ್ಹವಾದರೆ ಎರಡರಲ್ಲೂ ಸಮಾನ. ಪೂರ್ಣ ದರದ ಬೇರ್ಪಡೆ.'],
gapLabel:['If only basic were used, 5-year shortfall:','إذا استُخدم الأساسي وحده، نقص 5 سنوات:','അടിസ്ഥാന ശമ്പളം മാത്രം ഉപയോഗിച്ചാൽ 5 വർഷത്തെ കുറവ്:','केवल मूल वेतन लेने पर 5 वर्ष की कमी:','শুধু মূল বেতন ধরলে ৫ বছরের ঘাটতি:','அடிப்படை மட்டும் பயன்படுத்தினால் 5 ஆண்டு பற்றாக்குறை:','ಮೂಲ ವೇತನ ಮಾತ್ರ ಬಳಸಿದರೆ 5 ವರ್ಷದ ಕೊರತೆ:'],
gapNote:['Potential underpayment, not a lawful benefit reduction. Reclassifying fixed pay as allowances does not automatically remove it from EOSB.','نقص محتمل وليس تخفيضاً قانونياً. تسمية الأجر الثابت بدلات لا تستبعده تلقائياً من المكافأة.','ഇത് സാധ്യതയുള്ള കുറഞ്ഞ പേയ്‌മെന്റാണ്; നിയമാനുസൃത കുറവല്ല. സ്ഥിര ശമ്പളത്തെ അലവൻസ് എന്നു വിളിച്ചാൽ EOSBയിൽ നിന്ന് സ്വയം ഒഴിവാകില്ല.','संभावित कम भुगतान, वैध कटौती नहीं। स्थिर वेतन को भत्ता कहने से वह अपने आप EOSB से बाहर नहीं होता।','সম্ভাব্য কম প্রদান, বৈধ হ্রাস নয়। স্থির বেতনকে ভাতা বললেই EOSB থেকে বাদ পড়ে না।','இது சாத்தியமான குறைவான வழங்கல்; சட்டப்பூர்வக் குறைப்பு அல்ல. நிலையான ஊதியத்தை படி என அழைப்பதால் EOSB இலிருந்து தானாக விலக்க முடியாது.','ಇದು ಸಂಭವನೀಯ ಕಡಿಮೆ ಪಾವತಿ; ಕಾನೂನುಬದ್ಧ ಕಡಿತವಲ್ಲ. ಸ್ಥಿರ ವೇತನವನ್ನು ಭತ್ಯೆ ಎಂದರೆ EOSBಯಿಂದ ಸ್ವಯಂ ಹೊರಗಾಗುವುದಿಲ್ಲ.'],
method:['How this is calculated','طريقة الحساب','കണക്കാക്കുന്ന വിധം','गणना की विधि','গণনার পদ্ধতি','கணக்கிடும் முறை','ಲೆಕ್ಕಾಚಾರದ ವಿಧಾನ'],
splitMethod:['Article 107: hourly actual wage + 50% of hourly basic wage. This estimate assumes 30 days × 8 hours = 240 hours/month. Five-year full EOSB = eligible monthly wage × 2.5. Figures are rounded only for display.','المادة 107: أجر الساعة الفعلي + 50% من أجر الساعة الأساسي. نفترض 30 يوماً × 8 ساعات = 240 ساعة شهرياً. مكافأة 5 سنوات الكاملة = الأجر الشهري المستحق × 2.5. التقريب للعرض فقط.','ആർട്ടിക്കിൾ 107: യഥാർത്ഥ മണിക്കൂർ വേതനം + അടിസ്ഥാന മണിക്കൂർ വേതനത്തിന്റെ 50%. ഇവിടെ 30 ദിവസം × 8 മണിക്കൂർ = 240 മണിക്കൂർ/മാസം. 5 വർഷത്തെ പൂർണ്ണ EOSB = അർഹമായ മാസവേതനം × 2.5. പ്രദർശനത്തിന് മാത്രം റൗണ്ട് ചെയ്യുന്നു.','अनुच्छेद 107: वास्तविक प्रति घंटा वेतन + मूल प्रति घंटा वेतन का 50%। अनुमान: 30 दिन × 8 घंटे = 240 घंटे/माह। पूर्ण 5-वर्ष EOSB = पात्र मासिक वेतन × 2.5। केवल प्रदर्शन में पूर्णांकन।','অনুচ্ছেদ ১০৭: প্রকৃত ঘণ্টা বেতন + মূল ঘণ্টা বেতনের ৫০%। এখানে ৩০ দিন × ৮ ঘণ্টা = ২৪০ ঘণ্টা/মাস। পূর্ণ ৫ বছরের EOSB = যোগ্য মাসিক বেতন × ২.৫। শুধু প্রদর্শনে রাউন্ড করা হয়।','பிரிவு 107: உண்மையான மணிநேர ஊதியம் + அடிப்படை மணிநேர ஊதியத்தில் 50%. இங்கு 30 நாட்கள் × 8 மணி = 240 மணி/மாதம். முழு 5 ஆண்டு EOSB = தகுதி மாத ஊதியம் × 2.5. காட்சிக்கு மட்டும் முழுமையாக்கம்.','ವಿಧಿ 107: ನಿಜವಾದ ಗಂಟೆ ವೇತನ + ಮೂಲ ಗಂಟೆ ವೇತನದ 50%. ಇಲ್ಲಿ 30 ದಿನ × 8 ಗಂಟೆ = 240 ಗಂಟೆ/ತಿಂಗಳು. ಪೂರ್ಣ 5 ವರ್ಷದ EOSB = ಅರ್ಹ ಮಾಸಿಕ ವೇತನ × 2.5. ಪ್ರದರ್ಶನಕ್ಕೆ ಮಾತ್ರ ಸುತ್ತುಗೊಳಿಸಲಾಗುತ್ತದೆ.'],
wageNote:['Article 84 uses the last eligible wage, generally including fixed contractual allowances. Article 86 permits agreed exclusions of variable commissions and similar fluctuating components. Verify the wage basis in your contract.','المادة 84 تعتمد الأجر الأخير المستحق، ويشمل عادةً البدلات التعاقدية الثابتة. تسمح المادة 86 بالاتفاق على استبعاد العمولات المتغيرة وما شابهها. تحقق من أساس الأجر بعقدك.','ആർട്ടിക്കിൾ 84 അവസാനത്തെ അർഹമായ വേതനം ഉപയോഗിക്കുന്നു; സാധാരണ സ്ഥിര കരാർ അലവൻസുകൾ ഉൾപ്പെടും. ആർട്ടിക്കിൾ 86 പ്രകാരം മാറുന്ന കമ്മീഷനുകൾ പോലുള്ള ഘടകങ്ങൾ ധാരണയോടെ ഒഴിവാക്കാം. കരാറിലെ വേതന അടിസ്ഥാനം പരിശോധിക്കൂ.','अनुच्छेद 84 अंतिम पात्र वेतन लेता है, जिसमें सामान्यतः स्थिर अनुबंध भत्ते शामिल हैं। अनुच्छेद 86 सहमति से परिवर्तनीय कमीशन जैसे घटक बाहर रखने देता है। अनुबंध में वेतन आधार जाँचें।','অনুচ্ছেদ ৮৪ শেষ যোগ্য বেতন ধরে, সাধারণত স্থির চুক্তিভিত্তিক ভাতাসহ। অনুচ্ছেদ ৮৬ সম্মতিতে পরিবর্তনশীল কমিশন বাদ দেওয়ার সুযোগ দেয়। চুক্তির বেতন ভিত্তি যাচাই করুন।','பிரிவு 84 கடைசி தகுதி ஊதியத்தைப் பயன்படுத்துகிறது; பொதுவாக நிலையான ஒப்பந்தப் படிகள் அடங்கும். பிரிவு 86 ஒப்புதலுடன் மாறும் கமிஷன்களை விலக்க அனுமதிக்கிறது. ஒப்பந்த ஊதிய அடிப்படையைச் சரிபார்க்கவும்.','ವಿಧಿ 84 ಕೊನೆಯ ಅರ್ಹ ವೇತನ ಬಳಸುತ್ತದೆ; ಸಾಮಾನ್ಯವಾಗಿ ಸ್ಥಿರ ಒಪ್ಪಂದದ ಭತ್ಯೆಗಳು ಸೇರುತ್ತವೆ. ವಿಧಿ 86 ಒಪ್ಪಿಗೆಯೊಂದಿಗೆ ಬದಲಾಗುವ ಕಮಿಷನ್‌ಗಳನ್ನು ಹೊರಗಿಡಲು ಅನುಮತಿಸುತ್ತದೆ. ಒಪ್ಪಂದದ ವೇತನ ಆಧಾರ ಪರಿಶೀಲಿಸಿ.'],

cliffDesc:['You are close to 2 years. Ordinary resignation before 2 completed years gives no EOSB; at 2 years, one-third becomes payable. Check the actual separation date.','أنت قريب من سنتين. الاستقالة العادية قبل إكمال سنتين لا تستحق مكافأة؛ عند سنتين تستحق الثلث. تحقق من تاريخ الانتهاء الفعلي.','2 വർഷം അടുത്തിരിക്കുന്നു. സാധാരണ രാജിക്ക് 2 വർഷം പൂർത്തിയാകും മുമ്പ് EOSB ഇല്ല; 2 വർഷത്തിൽ മൂന്നിലൊന്ന് ലഭിക്കും. യഥാർത്ഥ സേവനാവസാന തീയതി പരിശോധിക്കൂ.','2 वर्ष नज़दीक हैं। सामान्य इस्तीफ़े में 2 पूरे वर्ष से पहले EOSB नहीं; 2 वर्ष पर एक-तिहाई देय। वास्तविक समाप्ति तारीख जाँचें।','২ বছর কাছাকাছি। সাধারণ পদত্যাগে ২ পূর্ণ বছরের আগে EOSB নেই; ২ বছরে এক-তৃতীয়াংশ প্রাপ্য। প্রকৃত শেষ তারিখ যাচাই করুন।','2 ஆண்டுகள் நெருங்குகின்றன. சாதாரண ராஜினாமாவில் 2 ஆண்டுகளுக்கு முன் EOSB இல்லை; 2 ஆண்டில் மூன்றில் ஒன்று கிடைக்கும். உண்மையான முடிவுத் தேதியைச் சரிபார்க்கவும்.','2 ವರ್ಷ ಸಮೀಪಿಸಿದೆ. ಸಾಮಾನ್ಯ ರಾಜೀನಾಮೆಗೆ 2 ಪೂರ್ಣ ವರ್ಷದ ಮೊದಲು EOSB ಇಲ್ಲ; 2 ವರ್ಷಕ್ಕೆ ಮೂರನೇ ಒಂದು ಭಾಗ ದೊರೆಯುತ್ತದೆ. ನಿಜವಾದ ಬೇರ್ಪಡೆ ದಿನಾಂಕ ಪರಿಶೀಲಿಸಿ.'],
eosbMethod:['Full award: half a month/year for the first 5 years, then one month/year, prorated. Ordinary resignation: under 2 years = 0; 2 through exactly 5 = 1/3; over 5 but under 10 = 2/3; 10 or more = full.','المكافأة الكاملة: نصف شهر لكل سنة من أول 5 سنوات، ثم شهر لكل سنة، مع التناسب للكسور. الاستقالة العادية: أقل من سنتين = 0؛ من سنتين حتى 5 بالضبط = الثلث؛ أكثر من 5 وأقل من 10 = الثلثان؛ 10 فأكثر = كاملة.','പൂർണ്ണ തുക: ആദ്യ 5 വർഷത്തിന് വർഷംതോറും അര മാസവേതനം; പിന്നീട് ഒരു മാസവേതനം; ഭാഗിക വർഷത്തിന് അനുപാതം. സാധാരണ രാജി: 2ൽ താഴെ = 0; 2 മുതൽ കൃത്യം 5 വരെ = 1/3; 5ന് മുകളിൽ 10ൽ താഴെ = 2/3; 10 മുതൽ പൂർണ്ണം.','पूर्ण लाभ: पहले 5 वर्ष आधा माह/वर्ष, फिर एक माह/वर्ष; आंशिक अवधि आनुपातिक। सामान्य इस्तीफ़ा: 2 से कम = 0; 2 से ठीक 5 तक = 1/3; 5 से अधिक और 10 से कम = 2/3; 10 या अधिक = पूरा।','পূর্ণ সুবিধা: প্রথম ৫ বছর অর্ধ মাস/বছর, এরপর এক মাস/বছর; ভগ্নাংশ আনুপাতিক। সাধারণ পদত্যাগ: ২ এর কম = ০; ২ থেকে ঠিক ৫ = ১/৩; ৫ এর বেশি কিন্তু ১০ এর কম = ২/৩; ১০ বা বেশি = পূর্ণ।','முழு பலன்: முதல் 5 ஆண்டுகள் அரை மாதம்/ஆண்டு; பின்னர் ஒரு மாதம்/ஆண்டு; பகுதிக்கு விகிதாசாரம். சாதாரண ராஜினாமா: 2க்கு குறைவு = 0; 2 முதல் சரியாக 5 வரை = 1/3; 5க்கு மேல் 10க்கு கீழ் = 2/3; 10 அல்லது மேல் = முழு.','ಪೂರ್ಣ ಮೊತ್ತ: ಮೊದಲ 5 ವರ್ಷ ಅರ್ಧ ತಿಂಗಳು/ವರ್ಷ; ನಂತರ ಒಂದು ತಿಂಗಳು/ವರ್ಷ; ಭಾಗಶಃ ಅವಧಿಗೆ ಅನುಪಾತ. ಸಾಮಾನ್ಯ ರಾಜೀನಾಮೆ: 2ಕ್ಕಿಂತ ಕಡಿಮೆ = 0; 2ರಿಂದ ನಿಖರವಾಗಿ 5ವರೆಗೆ = 1/3; 5ಕ್ಕಿಂತ ಹೆಚ್ಚು 10ಕ್ಕಿಂತ ಕಡಿಮೆ = 2/3; 10 ಅಥವಾ ಹೆಚ್ಚು = ಪೂರ್ಣ.'],
exceptions:['Ordinary eligible separations only. Probation (Article 54), qualifying misconduct (Article 80), protected departures (Article 81), Article 87 exceptions and better contractual terms can change entitlement. Not for domestic-worker contracts.','للإنهاء العادي المستحق فقط. التجربة (54)، المخالفات المؤهلة (80)، ترك العمل المشروع (81)، استثناءات 87، والشروط الأفضل قد تغير الاستحقاق. لا يشمل عقود العمالة المنزلية.','സാധാരണ അർഹമായ സേവനാവസാനത്തിന് മാത്രം. പ്രൊബേഷൻ (54), ഗുരുതര വീഴ്ച (80), സംരക്ഷിത പിരിയൽ (81), ആർട്ടിക്കിൾ 87 ഒഴിവുകൾ, മെച്ചപ്പെട്ട കരാർ വ്യവസ്ഥകൾ എന്നിവ ഫലം മാറ്റാം. ഗാർഹിക തൊഴിലാളി കരാറുകൾക്കല്ല.','सामान्य पात्र समाप्ति के लिए। परिवीक्षा (54), पात्र कदाचार (80), सुरक्षित अलगाव (81), अनुच्छेद 87 और बेहतर अनुबंध शर्तें लाभ बदल सकती हैं। घरेलू कामगार अनुबंध हेतु नहीं।','সাধারণ যোগ্য চাকরি শেষের জন্য। পরীক্ষাকাল (৫৪), গুরুতর অসদাচরণ (৮০), সুরক্ষিত বিচ্ছেদ (৮১), অনুচ্ছেদ ৮৭ ও উন্নত চুক্তি শর্তে ফল বদলাতে পারে। গৃহকর্মীর চুক্তির জন্য নয়।','சாதாரண தகுதியான பணி முடிவுகளுக்கு மட்டும். சோதனைக்காலம் (54), தகுதியான தவறு (80), பாதுகாக்கப்பட்ட வெளியேற்றம் (81), பிரிவு 87 மற்றும் மேம்பட்ட ஒப்பந்த நிபந்தனைகள் பலனை மாற்றலாம். வீட்டுப் பணியாளர் ஒப்பந்தங்களுக்கு அல்ல.','ಸಾಮಾನ್ಯ ಅರ್ಹ ಬೇರ್ಪಡೆಗೆ ಮಾತ್ರ. ಪರೀಕ್ಷಾ ಅವಧಿ (54), ಅರ್ಹ ದುರ್ವರ್ತನೆ (80), ರಕ್ಷಿತ ನಿರ್ಗಮನ (81), ವಿಧಿ 87 ಮತ್ತು ಉತ್ತಮ ಒಪ್ಪಂದ ಷರತ್ತುಗಳು ಹಕ್ಕನ್ನು ಬದಲಿಸಬಹುದು. ಗೃಹಕಾರ್ಮಿಕ ಒಪ್ಪಂದಗಳಿಗೆ ಅಲ್ಲ.'],
calendar:['Months are estimated as 1/12 of a year. Use completed service in the contract’s applicable calendar; exact dates and excluded periods may change the final award.','نقدر الشهر بـ1/12 سنة. استخدم الخدمة المكتملة وفق تقويم العقد؛ التواريخ الدقيقة والفترات المستبعدة قد تغير المكافأة النهائية.','മാസം വർഷത്തിന്റെ 1/12 ആയി കണക്കാക്കുന്നു. കരാറിന് ബാധകമായ കലണ്ടറിലെ പൂർത്തിയായ സേവനം നൽകൂ; കൃത്യമായ തീയതികളും ഒഴിവാക്കുന്ന കാലയളവുകളും അന്തിമ തുക മാറ്റാം.','महीने को वर्ष का 1/12 माना गया है। अनुबंध के लागू कैलेंडर की पूरी सेवा लें; सटीक तारीखें और अपवर्जित अवधि अंतिम राशि बदल सकती हैं।','মাসকে বছরের ১/১২ ধরা হয়েছে। চুক্তির প্রযোজ্য ক্যালেন্ডারের সম্পূর্ণ মেয়াদ দিন; সঠিক তারিখ ও বাদ দেওয়া সময়ে চূড়ান্ত অর্থ বদলাতে পারে।','மாதம் ஆண்டின் 1/12 என மதிப்பிடப்படுகிறது. ஒப்பந்த நாட்காட்டியின் நிறைவு சேவையைப் பயன்படுத்தவும்; துல்லியத் தேதிகள் மற்றும் விலக்கப்பட்ட காலங்கள் இறுதித் தொகையை மாற்றலாம்.','ತಿಂಗಳನ್ನು ವರ್ಷದ 1/12 ಎಂದು ಅಂದಾಜಿಸಲಾಗಿದೆ. ಒಪ್ಪಂದದ ಕ್ಯಾಲೆಂಡರ್‌ನ ಪೂರ್ಣ ಸೇವೆ ಬಳಸಿ; ನಿಖರ ದಿನಾಂಕ ಮತ್ತು ಹೊರಗಿಟ್ಟ ಅವಧಿಗಳು ಅಂತಿಮ ಮೊತ್ತ ಬದಲಿಸಬಹುದು.'],
invalidEosb:['Use nonnegative wages up to 10,000,000 SAR, whole years from 0–100 and months from 0–11.','استخدم أجوراً غير سالبة حتى 10,000,000 ر.س، وسنوات كاملة 0–100 وأشهراً 0–11.','0 മുതൽ 10,000,000 SAR വരെ വേതനം, 0–100 പൂർണ്ണ വർഷങ്ങൾ, 0–11 മാസങ്ങൾ നൽകൂ.','0–10,000,000 SAR वेतन, 0–100 पूरे वर्ष और 0–11 महीने लें।','০–১০,০০০,০০০ SAR বেতন, ০–১০০ পূর্ণ বছর ও ০–১১ মাস দিন।','0–10,000,000 SAR ஊதியம், 0–100 முழு ஆண்டுகள் மற்றும் 0–11 மாதங்கள் உள்ளிடவும்.','0–10,000,000 SAR ವೇತನ, 0–100 ಪೂರ್ಣ ವರ್ಷ ಮತ್ತು 0–11 ತಿಂಗಳು ಬಳಸಿ.'],
auditTitle:['Before you sign on Qiwa','قبل التوقيع في قوى','Qiwaയിൽ ഒപ്പിടുന്നതിന് മുമ്പ്','Qiwa पर हस्ताक्षर से पहले','Qiwa-তে স্বাক্ষরের আগে','Qiwa இல் கையொப்பமிடும் முன்','Qiwaನಲ್ಲಿ ಸಹಿ ಮಾಡುವ ಮೊದಲು'],
auditDesc:['Three checks to help you ask the right questions.','ثلاثة فحوص تساعدك على طرح الأسئلة الصحيحة.','ശരിയായ ചോദ്യങ്ങൾ ചോദിക്കാൻ മൂന്ന് പരിശോധനകൾ.','सही सवाल पूछने के लिए तीन जाँच।','সঠিক প্রশ্নের জন্য তিনটি যাচাই।','சரியான கேள்விகளுக்கான மூன்று ஆய்வுகள்.','ಸರಿಯಾದ ಪ್ರಶ್ನೆಗಳಿಗೆ ಮೂರು ಪರಿಶೀಲನೆಗಳು.'],
qPassport:['Is your employer withholding your physical passport?','هل يحتفظ صاحب العمل بجواز سفرك الأصلي؟','തൊഴിലുടമ നിങ്ങളുടെ അസൽ പാസ്‌പോർട്ട് പിടിച്ചുവെച്ചിട്ടുണ്ടോ?','क्या नियोक्ता आपका मूल पासपोर्ट रोके हुए है?','নিয়োগকর্তা কি আপনার আসল পাসপোর্ট আটকে রেখেছেন?','முதலாளி உங்கள் அசல் கடவுச்சீட்டை வைத்திருக்கிறாரா?','ಉದ್ಯೋಗದಾತ ನಿಮ್ಮ ಮೂಲ ಪಾಸ್‌ಪೋರ್ಟ್ ತಡೆದಿಟ್ಟಿದ್ದಾರೆಯೇ?'],
qProbation:['Does your contract specify probation longer than 180 days?','هل يحدد عقدك تجربة تتجاوز 180 يوماً؟','കരാറിൽ പ്രൊബേഷൻ 180 ദിവസത്തിൽ കൂടുതലാണോ?','क्या अनुबंध में परिवीक्षा 180 दिन से अधिक है?','চুক্তিতে পরীক্ষাকাল কি ১৮০ দিনের বেশি?','ஒப்பந்தத்தில் சோதனைக்காலம் 180 நாட்களை விட அதிகமா?','ಒಪ್ಪಂದದ ಪರೀಕ್ಷಾ ಅವಧಿ 180 ದಿನಕ್ಕಿಂತ ಹೆಚ್ಚೇ?'],
qBasic:['Is basic salary below 50% of your total monthly package?','هل الأساسي أقل من 50% من إجمالي راتبك الشهري؟','മാസ ശമ്പളത്തിലെ അടിസ്ഥാന വിഹിതം 50%ൽ താഴെയാണോ?','क्या मूल वेतन कुल मासिक वेतन के 50% से कम है?','মূল বেতন কি মোট মাসিক বেতনের ৫০% এর কম?','அடிப்படைச் சம்பளம் மொத்தத்தின் 50%க்குக் குறைவா?','ಮೂಲ ವೇತನ ಒಟ್ಟು ಮಾಸಿಕ ವೇತನದ 50%ಕ್ಕಿಂತ ಕಡಿಮೆಯೇ?'],

passportTitle:['Passport withholding · red flag','حجز جواز السفر · تنبيه أحمر','പാസ്‌പോർട്ട് പിടിച്ചുവെക്കൽ · ഗുരുതര മുന്നറിയിപ്പ്','पासपोर्ट रोकना · गंभीर संकेत','পাসপোর্ট আটকে রাখা · গুরুতর সতর্কতা','கடவுச்சீட்டை வைத்திருத்தல் · கடும் எச்சரிக்கை','ಪಾಸ್‌ಪೋರ್ಟ್ ತಡೆಹಿಡಿಯುವುದು · ಗಂಭೀರ ಎಚ್ಚರಿಕೆ'],
passportAlert:['Ask for your passport back and seek MHRSD guidance if it is withheld. Employers may not retain workers’ passports.','اطلب استعادة جوازك واستعن بالوزارة إذا احتُجز. لا يجوز لصاحب العمل الاحتفاظ بجواز العامل.','പാസ്‌പോർട്ട് തിരികെ ചോദിക്കൂ; പിടിച്ചുവെച്ചാൽ MHRSDയുടെ സഹായം തേടൂ. തൊഴിലുടമയ്ക്ക് തൊഴിലാളിയുടെ പാസ്‌പോർട്ട് പിടിച്ചുവെക്കാൻ പാടില്ല.','पासपोर्ट वापस माँगें और रोके जाने पर MHRSD से मार्गदर्शन लें। नियोक्ता कामगार का पासपोर्ट नहीं रोक सकते।','পাসপোর্ট ফেরত চান; আটকে রাখলে MHRSD-এর নির্দেশনা নিন। নিয়োগকর্তা কর্মীর পাসপোর্ট রাখতে পারেন না।','கடவுச்சீட்டைத் திரும்பக் கேளுங்கள்; தடுத்தால் MHRSD உதவியை நாடவும். முதலாளி தொழிலாளரின் கடவுச்சீட்டை வைத்திருக்கக் கூடாது.','ಪಾಸ್‌ಪೋರ್ಟ್ ಹಿಂದಿರುಗಿಸಲು ಕೇಳಿ; ತಡೆದರೆ MHRSD ಮಾರ್ಗದರ್ಶನ ಪಡೆಯಿರಿ. ಉದ್ಯೋಗದಾತ ಕಾರ್ಮಿಕರ ಪಾಸ್‌ಪೋರ್ಟ್ ಉಳಿಸಿಕೊಳ್ಳಬಾರದು.'],
passportCite:['Council of Ministers Decision No. 166; Implementing Regulations, Article 6.','قرار مجلس الوزراء رقم 166؛ المادة 6 من اللائحة التنفيذية.','മന്ത്രിസഭ തീരുമാനം 166; നടപ്പാക്കൽ ചട്ടം ആർട്ടിക്കിൾ 6.','मंत्रिपरिषद निर्णय सं. 166; कार्यान्वयन नियम अनुच्छेद 6।','মন্ত্রীপরিষদ সিদ্ধান্ত নং ১৬৬; বাস্তবায়ন বিধি অনুচ্ছেদ ৬।','அமைச்சரவை முடிவு எண் 166; நடைமுறை விதிகள் பிரிவு 6.','ಮಂತ್ರಿಮಂಡಲ ನಿರ್ಣಯ ಸಂಖ್ಯೆ 166; ಅನುಷ್ಠಾನ ನಿಯಮ ವಿಧಿ 6.'],
probationTitle:['Probation limit · red flag','حد التجربة · تنبيه أحمر','പ്രൊബേഷൻ പരിധി · ഗുരുതര മുന്നറിയിപ്പ്','परिवीक्षा सीमा · गंभीर संकेत','পরীক্ষাকালের সীমা · গুরুতর সতর্কতা','சோதனைக்கால வரம்பு · கடும் எச்சரிக்கை','ಪರೀಕ್ಷಾ ಅವಧಿಯ ಮಿತಿ · ಗಂಭೀರ ಎಚ್ಚರಿಕೆ'],
probationAlert:['Article 53 caps probation at 180 days. Ask for the clause to be corrected. Regulatory excluded days can affect elapsed calendar time.','المادة 53 تحدد التجربة بحد أقصى 180 يوماً. اطلب تصحيح البند. الأيام المستبعدة نظاماً قد تؤثر على المدة التقويمية.','ആർട്ടിക്കിൾ 53 പ്രൊബേഷൻ പരമാവധി 180 ദിവസമാക്കുന്നു. വ്യവസ്ഥ തിരുത്താൻ ആവശ്യപ്പെടൂ. ചട്ടപ്രകാരം ഒഴിവാക്കുന്ന ദിവസങ്ങൾ കലണ്ടർ ദൈർഘ്യം മാറ്റാം.','अनुच्छेद 53 में अधिकतम 180 दिन परिवीक्षा है। खंड सुधारने को कहें। नियमानुसार अपवर्जित दिन कैलेंडर अवधि बदल सकते हैं।','অনুচ্ছেদ ৫৩ পরীক্ষাকাল সর্বোচ্চ ১৮০ দিন করে। শর্ত সংশোধন করতে বলুন। নিয়মে বাদ দেওয়া দিন ক্যালেন্ডার মেয়াদ বদলাতে পারে।','பிரிவு 53 சோதனைக்காலத்தை 180 நாட்களாகக் கட்டுப்படுத்துகிறது. நிபந்தனையைத் திருத்தக் கேளுங்கள். விதிகளால் விலக்கப்பட்ட நாட்கள் நாட்காட்டி காலத்தை மாற்றலாம்.','ವಿಧಿ 53 ಪರೀಕ್ಷಾ ಅವಧಿಯನ್ನು ಗರಿಷ್ಠ 180 ದಿನಕ್ಕೆ ಮಿತಿಗೊಳಿಸುತ್ತದೆ. ಷರತ್ತು ಸರಿಪಡಿಸಲು ಕೇಳಿ. ನಿಯಮದ ಹೊರಗಿಟ್ಟ ದಿನಗಳು ಕ್ಯಾಲೆಂಡರ್ ಅವಧಿ ಬದಲಿಸಬಹುದು.'],
probationCite:['Saudi Labor Law · Article 53 (as amended).','نظام العمل السعودي · المادة 53 المعدلة.','സൗദി തൊഴിൽ നിയമം · ഭേദഗതി ചെയ്ത ആർട്ടിക്കിൾ 53.','सऊदी श्रम कानून · संशोधित अनुच्छेद 53।','সৌদি শ্রম আইন · সংশোধিত অনুচ্ছেদ ৫৩।','சவுதி தொழிலாளர் சட்டம் · திருத்தப்பட்ட பிரிவு 53.','ಸೌದಿ ಕಾರ್ಮಿಕ ಕಾನೂನು · ತಿದ್ದುಪಡಿಗೊಂಡ ವಿಧಿ 53.'],
salaryTitle:['Low basic share · negotiation flag','نسبة أساسي منخفضة · تنبيه تفاوضي','കുറഞ്ഞ അടിസ്ഥാന വിഹിതം · ചർച്ച ചെയ്യേണ്ട വിഷയം','कम मूल हिस्सा · बातचीत का संकेत','কম মূল অংশ · আলোচনার বিষয়','குறைந்த அடிப்படைப் பங்கு · பேச்சுவார்த்தை எச்சரிக்கை','ಕಡಿಮೆ ಮೂಲ ಪಾಲು · ಮಾತುಕತೆಯ ಸೂಚನೆ'],
salaryAlert:['Below 50% is a financial review flag, not a legal violation. Check overtime pay under Article 107 and confirm which allowances count toward EOSB.','أقل من 50% مؤشر مراجعة مالية وليس مخالفة قانونية. تحقق من أجر الإضافي وفق المادة 107 ومن البدلات الداخلة في مكافأة نهاية الخدمة.','50%ൽ താഴെ സാമ്പത്തിക പരിശോധനയ്ക്കുള്ള സൂചനയാണ്; നിയമലംഘനമല്ല. ആർട്ടിക്കിൾ 107 ഓവർടൈമും EOSBയിൽ ഉൾപ്പെടുന്ന അലവൻസുകളും പരിശോധിക്കൂ.','50% से कम वित्तीय समीक्षा का संकेत है, कानूनी उल्लंघन नहीं। अनुच्छेद 107 का ओवरटाइम और EOSB में शामिल भत्ते जाँचें।','৫০% এর কম আর্থিক পর্যালোচনার সংকেত, আইনি লঙ্ঘন নয়। অনুচ্ছেদ ১০৭-এর ওভারটাইম ও EOSB-তে গণ্য ভাতা যাচাই করুন।','50%க்குக் குறைவு நிதி ஆய்வுக்கான எச்சரிக்கை; சட்டமீறல் அல்ல. பிரிவு 107 கூடுதல் ஊதியம் மற்றும் EOSB படிகளைச் சரிபார்க்கவும்.','50%ಕ್ಕಿಂತ ಕಡಿಮೆ ಹಣಕಾಸಿನ ಪರಿಶೀಲನೆಗೆ ಸೂಚನೆ; ಕಾನೂನು ಉಲ್ಲಂಘನೆಯಲ್ಲ. ವಿಧಿ 107 ಹೆಚ್ಚುವರಿ ವೇತನ ಮತ್ತು EOSBಯ ಭತ್ಯೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ.'],
salaryCite:['Articles 84, 86 & 107 · no statutory 50% basic ratio.','المواد 84 و86 و107 · لا نسبة أساسي إلزامية قدرها 50%.','ആർട്ടിക്കിളുകൾ 84, 86, 107 · നിയമപരമായ 50% അടിസ്ഥാന അനുപാതമില്ല.','अनुच्छेद 84, 86 और 107 · 50% मूल अनुपात अनिवार्य नहीं।','অনুচ্ছেদ ৮৪, ৮৬ ও ১০৭ · ৫০% মূল অনুপাত বাধ্যতামূলক নয়।','பிரிவுகள் 84, 86 & 107 · சட்டப்பூர்வ 50% விகிதம் இல்லை.','ವಿಧಿಗಳು 84, 86 ಮತ್ತು 107 · ಕಡ್ಡಾಯ 50% ಮೂಲ ಅನುಪಾತವಿಲ್ಲ.'],
auditLimit:['This is a limited screening, not contract approval. If unsure, verify the Arabic Qiwa contract and contact MHRSD or a qualified adviser before signing.','هذا فحص محدود وليس اعتماداً للعقد. عند الشك، تحقق من عقد قوى العربي واستشر الوزارة أو مختصاً قبل التوقيع.','ഇത് പരിമിത പരിശോധനയാണ്; കരാർ അംഗീകാരമല്ല. സംശയമുണ്ടെങ്കിൽ അറബി Qiwa കരാർ പരിശോധിച്ച് ഒപ്പിടുന്നതിനു മുമ്പ് MHRSDയെയോ വിദഗ്ധനെയോ സമീപിക്കൂ.','यह सीमित जाँच है, अनुबंध की मंज़ूरी नहीं। संदेह पर अरबी Qiwa अनुबंध जाँचें और हस्ताक्षर से पहले MHRSD या योग्य सलाहकार से संपर्क करें।','এটি সীমিত যাচাই, চুক্তির অনুমোদন নয়। সন্দেহ হলে আরবি Qiwa চুক্তি যাচাই করে স্বাক্ষরের আগে MHRSD বা যোগ্য পরামর্শককে জিজ্ঞাসা করুন।','இது வரையறுக்கப்பட்ட ஆய்வு; ஒப்பந்த ஒப்புதல் அல்ல. சந்தேகமிருந்தால் அரபு Qiwa ஒப்பந்தத்தைச் சரிபார்த்து கையொப்பமிடும் முன் MHRSD அல்லது தகுதி ஆலோசகரை அணுகவும்.','ಇದು ಸೀಮಿತ ಪರಿಶೀಲನೆ; ಒಪ್ಪಂದದ ಅನುಮೋದನೆಯಲ್ಲ. ಅನುಮಾನವಿದ್ದರೆ ಅರೇಬಿಕ್ Qiwa ಒಪ್ಪಂದ ಪರಿಶೀಲಿಸಿ ಸಹಿಯ ಮೊದಲು MHRSD ಅಥವಾ ಅರ್ಹ ಸಲಹೆಗಾರರನ್ನು ಸಂಪರ್ಕಿಸಿ.'],
localOnly:['Calculations stay in your browser. No account needed.','الحسابات داخل متصفحك. لا حاجة لحساب.','കണക്കുകൾ നിങ്ങളുടെ ബ്രൗസറിൽ മാത്രം. അക്കൗണ്ട് വേണ്ട.','गणनाएँ आपके ब्राउज़र में रहती हैं। खाते की ज़रूरत नहीं।','গণনা আপনার ব্রাউজারে থাকে। অ্যাকাউন্ট প্রয়োজন নেই।','கணக்குகள் உங்கள் உலாவியில் இருக்கும். கணக்கு தேவையில்லை.','ಲೆಕ್ಕಾಚಾರಗಳು ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲೇ ಇರುತ್ತವೆ. ಖಾತೆ ಅಗತ್ಯವಿಲ್ಲ.'],

tagline:['Clarity for your contract. Confidence for your next step.','وضوح لعقدك. ثقة لخطوتك القادمة.','കരാറിൽ വ്യക്തത. അടുത്ത ചുവടിൽ ആത്മവിശ്വാസം.','अनुबंध में स्पष्टता। अगले कदम में विश्वास।','চুক্তিতে স্বচ্ছতা। পরের পদক্ষেপে আত্মবিশ্বাস।','ஒப்பந்தத்தில் தெளிவு. அடுத்த படியில் நம்பிக்கை.','ಒಪ್ಪಂದದಲ್ಲಿ ಸ್ಪಷ್ಟತೆ. ಮುಂದಿನ ಹೆಜ್ಜೆಗೆ ವಿಶ್ವಾಸ.'],

statutory:['Saudi Labor Law, Royal Decree No. M/51, as amended: Articles 84 & 85 (EOSB), 53 (probation), 107 (overtime); Articles 2 & 86 (wage basis). Passport protection: Council of Ministers Decision No. 166 and Implementing Regulations Article 6.','نظام العمل، المرسوم الملكي م/51 وتعديلاته: 84 و85 (نهاية الخدمة)، 53 (التجربة)، 107 (الإضافي)، 2 و86 (أساس الأجر). حماية الجواز: قرار مجلس الوزراء 166 والمادة 6 من اللائحة التنفيذية.','സൗദി തൊഴിൽ നിയമം, രാജകീയ ഉത്തരവ് M/51, ഭേദഗതികളോടെ: 84, 85 (EOSB), 53 (പ്രൊബേഷൻ), 107 (ഓവർടൈം), 2, 86 (വേതന അടിസ്ഥാനം). പാസ്‌പോർട്ട്: മന്ത്രിസഭ തീരുമാനം 166, നടപ്പാക്കൽ ചട്ടം 6.','सऊदी श्रम कानून, संशोधित शाही आदेश M/51: 84, 85 (EOSB), 53 (परिवीक्षा), 107 (ओवरटाइम), 2, 86 (वेतन आधार)। पासपोर्ट: मंत्रिपरिषद निर्णय 166 और कार्यान्वयन नियम 6।','সৌদি শ্রম আইন, সংশোধিত রাজকীয় ডিক্রি M/51: ৮৪, ৮৫ (EOSB), ৫৩ (পরীক্ষাকাল), ১০৭ (ওভারটাইম), ২, ৮৬ (বেতন ভিত্তি)। পাসপোর্ট: মন্ত্রীপরিষদ সিদ্ধান্ত ১৬৬ ও বাস্তবায়ন বিধি ৬।','சவுதி தொழிலாளர் சட்டம், திருத்தப்பட்ட அரசாணை M/51: 84, 85 (EOSB), 53 (சோதனைக்காலம்), 107 (கூடுதல் நேரம்), 2, 86 (ஊதிய அடிப்படை). கடவுச்சீட்டு: அமைச்சரவை முடிவு 166 மற்றும் நடைமுறை விதி 6.','ಸೌದಿ ಕಾರ್ಮಿಕ ಕಾನೂನು, ತಿದ್ದುಪಡಿಗೊಂಡ ರಾಜಾಜ್ಞೆ M/51: 84, 85 (EOSB), 53 (ಪರೀಕ್ಷಾ ಅವಧಿ), 107 (ಹೆಚ್ಚುವರಿ ಕೆಲಸ), 2, 86 (ವೇತನ ಆಧಾರ). ಪಾಸ್‌ಪೋರ್ಟ್: ಮಂತ್ರಿಮಂಡಲ ನಿರ್ಣಯ 166 ಮತ್ತು ಅನುಷ್ಠಾನ ನಿಯಮ 6.'],

disclaimer:['AqdLens is an independent research and empowerment utility, not affiliated with MHRSD or Qiwa. Estimates and translations are informational, not legal advice. The official Arabic law prevails; verify your circumstances with a qualified Saudi legal adviser.','عقد لينس أداة مستقلة للبحث والتمكين، غير تابعة للوزارة أو قوى. التقديرات والترجمات للتوعية وليست استشارة قانونية. النص العربي الرسمي هو المرجع؛ تحقق من ظروفك مع مختص قانوني سعودي.','AqdLens സ്വതന്ത്ര ഗവേഷണ-ശാക്തീകരണ ടൂളാണ്; MHRSDയുമായോ Qiwaയുമായോ ബന്ധമില്ല. കണക്കുകളും വിവർത്തനങ്ങളും വിവരത്തിനാണ്; നിയമോപദേശമല്ല. ഔദ്യോഗിക അറബി നിയമമാണ് പ്രാമാണികം; സൗദി നിയമ വിദഗ്ധനോട് പരിശോധിക്കൂ.','AqdLens स्वतंत्र शोध और सशक्तिकरण साधन है; MHRSD या Qiwa से संबद्ध नहीं। अनुमान और अनुवाद जानकारी के लिए हैं, कानूनी सलाह नहीं। आधिकारिक अरबी कानून मान्य है; योग्य सऊदी कानूनी सलाहकार से जाँचें।','AqdLens স্বাধীন গবেষণা ও ক্ষমতায়নের সহায়ক; MHRSD বা Qiwa-এর সঙ্গে যুক্ত নয়। অনুমান ও অনুবাদ তথ্যের জন্য, আইনি পরামর্শ নয়। সরকারি আরবি আইন প্রাধান্য পায়; যোগ্য সৌদি আইন পরামর্শকের সঙ্গে যাচাই করুন।','AqdLens சுயாதீன ஆய்வு மற்றும் அதிகாரமளிப்புக் கருவி; MHRSD அல்லது Qiwa உடன் தொடர்பில்லை. மதிப்பீடுகளும் மொழிபெயர்ப்புகளும் தகவலுக்காக; சட்ட ஆலோசனை அல்ல. அதிகாரப்பூர்வ அரபுச் சட்டமே மேலோங்கும்; தகுதியான சவுதி சட்ட ஆலோசகரிடம் சரிபார்க்கவும்.','AqdLens ಸ್ವತಂತ್ರ ಸಂಶೋಧನೆ ಮತ್ತು ಸಬಲೀಕರಣ ಸಾಧನ; MHRSD ಅಥವಾ Qiwa ಜೊತೆ ಸಂಬಂಧವಿಲ್ಲ. ಅಂದಾಜು ಮತ್ತು ಅನುವಾದಗಳು ಮಾಹಿತಿಗಾಗಿ; ಕಾನೂನು ಸಲಹೆಯಲ್ಲ. ಅಧಿಕೃತ ಅರೇಬಿಕ್ ಕಾನೂನು ಪ್ರಧಾನ; ಅರ್ಹ ಸೌದಿ ಕಾನೂನು ಸಲಹೆಗಾರರೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ.'],

/* Accessible tab switching; RTL changes the direction of horizontal key navigation. */
function switchTab(name,focus=false){activeTab=name;document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===name;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;$('panel-'+b.dataset.tab).hidden=!active;if(active&&focus)b.focus()})}
document.querySelectorAll('[data-tab]').forEach(b=>{b.addEventListener('click',()=>switchTab(b.dataset.tab));b.addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('[data-tab]')];let index=tabs.indexOf(b);if(e.key==='Home')index=0;else if(e.key==='End')index=tabs.length-1;else if(e.key==='ArrowRight')index=(index+(lang==='ar'?2:1))%3;else if(e.key==='ArrowLeft')index=(index+(lang==='ar'?1:2))%3;else return;e.preventDefault();switchTab(tabs[index].dataset.tab,true)})});

/* Legal award calculation: at exactly 5 years resignation remains one-third. */
function calculateEOSB(wage,years,months,reason){const service=years+months/12;const first=wage*.5*Math.min(service,5);const after=wage*Math.max(0,service-5);const factor=reason==='resign'?(service<2?0:service<=5?1/3:service<10?2/3:1):1;return{service,first,after,factor,total:(first+after)*factor}}
function updateSplit(){const total=inputNumber('package'),share=Number($('basic-range').value);const valid=validWage(total)&&total>=1;$('split-error').hidden=valid;$('package').setAttribute('aria-invalid',String(!valid));set('share',number(share,0)+'%');$('basic-range').setAttribute('aria-valuetext',number(share,0)+'% '+t('basic'));$('bar-basic').style.width=share+'%';$('bar-allow').style.width=(100-share)+'%';$('split-bar').setAttribute('aria-label',t('barFormat',{b:number(share,0),a:number(100-share,0)}));if(!valid){['basic-amount','allow-amount','offer-basic','fair-basic','offer-allow','fair-allow','offer-ot','fair-ot','ot-loss','legal-five','underpayment'].forEach(id=>set(id,'—'));return}const basic=total*share/100,fair=total*.7;const overtime=(total+.5*basic)/240,fairOT=(total+.5*fair)/240;set('basic-amount',money(basic));set('allow-amount',money(total-basic));set('offer-basic',number(basic));set('fair-basic',number(fair));set('offer-allow',money(total-basic));set('fair-allow',money(total-fair));set('offer-ot',money(overtime));set('fair-ot',money(fairOT));set('ot-loss',number((fairOT-overtime)/fairOT*100,1)+'%');set('legal-five',money(total*2.5));set('underpayment',money((total-basic)*2.5))}
function updateEOSB(){const basic=inputNumber('eosb-basic'),allow=inputNumber('eosb-allow'),years=inputNumber('years'),months=Number($('months').value);const valid=validWage(basic)&&validWage(allow)&&Number.isInteger(years)&&years>=0&&years<=100&&Number.isInteger(months)&&months>=0&&months<=11;$('eosb-error').hidden=valid;['eosb-basic','eosb-allow','years'].forEach(id=>{const v=inputNumber(id);$(id).setAttribute('aria-invalid',String(id==='years'?!(Number.isInteger(v)&&v>=0&&v<=100):!validWage(v)))});$('cliff').hidden=true;if(!valid){['eosb-total','calc-wage','calc-tenure','calc-first','calc-after','calc-factor'].forEach(id=>set(id,'—'));return}const result=calculateEOSB(basic+allow,years,months,$('reason').value);set('eosb-total',number(result.total));set('calc-wage',money(basic+allow));set('calc-tenure',t('tenureFormat',{y:number(years,0),m:number(months,0)}));set('calc-first',money(result.first));set('calc-after',money(result.after));set('calc-factor',number(result.factor*100,2)+'%');$('cliff').hidden=!($('reason').value==='resign'&&result.service>=1.7&&result.service<2)}
function createQuestions(){const host=$('questions');host.replaceChildren();[['passport','qPassport'],['probation','qProbation'],['basic','qBasic']].forEach(([key,label],i)=>{const field=document.createElement('fieldset');field.className='question';const legend=document.createElement('legend');legend.textContent=number(i+1,0)+'. '+t(label);field.append(legend);const choices=document.createElement('div');choices.className='choices';[['yes','yes'],['no','no'],['unsure','unsure']].forEach(([value,text])=>{const lab=document.createElement('label');lab.className='choice';const radio=document.createElement('input');radio.type='radio';radio.name='audit-'+key;radio.value=value;radio.checked=answers[key]===value;radio.addEventListener('change',()=>{answers[key]=value;updateAudit()});const span=document.createElement('span');span.textContent=t(text);lab.append(radio,span);choices.append(lab)});field.append(choices);host.append(field)})}
function updateAudit(){updateHR();const done=Object.values(answers).filter(v=>v==='yes'||v==='no').length;const flags=Object.values(answers).filter(v=>v==='yes').length;const started=Object.values(answers).some(Boolean);set('audit-status',t(flags?'statusReview':done===3?'statusClear':started?'statusIncomplete':'statusStart'));set('audit-summary',t('auditProgress',{n:number(done,0)}));const host=$('audit-alerts');host.replaceChildren();[['passport','passportTitle','passportAlert','passportCite'],['probation','probationTitle','probationAlert','probationCite'],['basic','salaryTitle','salaryAlert','salaryCite']].forEach(([key,title,message,cite])=>{if(answers[key]!=='yes')return;const el=document.createElement('div');el.className='alert'+(key==='basic'?' amber-alert':'');const strong=document.createElement('strong'),p=document.createElement('p'),small=document.createElement('small');strong.textContent=t(title);p.textContent=t(message);small.textContent=t(cite);el.append(strong,p,small);host.append(el)})}
function localize(value){lang=LANGS.includes(value)?value:'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('language').value=lang;$('feedback-status').hidden=true;$('print-status').hidden=true;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));const previous=$('months').value||'0';$('months').replaceChildren(...Array.from({length:12},(_,i)=>new Option(number(i,0),String(i))));$('months').value=previous;createQuestions();createChecklist();updateSplit();updateEOSB();updateAudit();try{localStorage.setItem('aqdlens-language',lang)}catch(_){/* Storage is optional; private browsing remains functional. */}}
$('language').addEventListener('change',e=>localize(e.target.value));['package','basic-range'].forEach(id=>$(id).addEventListener('input',updateSplit));['eosb-basic','eosb-allow','years','months','reason'].forEach(id=>$(id).addEventListener('input',updateEOSB));$('reset-audit').addEventListener('click',()=>{Object.keys(answers).forEach(k=>answers[k]=null);createQuestions();updateAudit()});

function createChecklist(){const host=$('checklist-items');host.replaceChildren();CHECKS.forEach(([key,label])=>{const lab=document.createElement('label');lab.className='checklist-item';const input=document.createElement('input');input.type='checkbox';input.checked=checklist[key];input.id='check-'+key;const span=document.createElement('span');span.textContent=t(label);input.addEventListener('change',()=>{checklist[key]=input.checked;updateHR()});lab.append(input,span);host.append(lab)})}
function hrQuestionKeys(){const keys=['hrWageBasis','hrOvertime'];if(answers.passport!=='no')keys.push(answers.passport==='yes'?'hrPassportReturn':'hrPassportConfirm');if(answers.probation==='yes')keys.push('hrProbationFix');else if(answers.probation!=='no'||!checklist.probation)keys.push('hrProbation');if(answers.basic==='yes')keys.push('hrBasicReview');CHECKS.forEach(([key,,question])=>{if(!checklist[key]&&!(key==='probation'&&answers.probation==='yes'))keys.push(question)});return[...new Set(keys)]}
function updateHR(){set('checklist-progress',t('checklistProgress',{n:number(Object.values(checklist).filter(Boolean).length,0)}));const host=$('hr-list');host.replaceChildren();hrQuestionKeys().forEach(key=>{const li=document.createElement('li');li.textContent=t(key);host.append(li)})}
function hrReportData(){return{title:t('hrTitle'),rows:hrQuestionKeys().map((key,i)=>[number(i+1,0),t(key)]),notes:[t('hrDesc'),t('checklistProgress',{n:number(Object.values(checklist).filter(Boolean).length,0)}),t('auditLimit')]}}
$('reset-checklist').addEventListener('click',()=>{Object.keys(checklist).forEach(key=>checklist[key]=false);createChecklist();updateHR()});
$('print-hr').addEventListener('click',()=>{printMode='hr';prepareReport();window.print()});
window.addEventListener('afterprint',()=>{printMode='tool'});

let saved='en';try{saved=localStorage.getItem('aqdlens-language')||localStorage.getItem('sanad-language')||'en'}catch(_){}localize(saved);

/* Snapshot the current tool, never hidden calculator panels or feedback text. */
function reportData(){
 const rows=[],notes=[];const row=(key,value)=>rows.push([t(key),value]);
 if(activeTab==='split'){
  const total=inputNumber('package');if(!validWage(total)||total<1)return null;
  updateSplit();row('package',money(total));row('basicShare',$('share').textContent);row('basic',$('basic-amount').textContent);row('allowances',$('allow-amount').textContent);row('benchmark',money(total*.7));row('otHour',$('offer-ot').textContent);row('benchmark',t('otHour')+': '+$('fair-ot').textContent);row('otReduction',$('ot-loss').textContent);row('legalEosb',$('legal-five').textContent);row('gapLabel',$('underpayment').textContent);
  notes.push(t('benchmarkNote'),t('legalFiveDesc'),t('gapNote'),t('splitMethod'),t('wageNote'));
 }else if(activeTab==='eosb'){
  updateEOSB();if(!$('eosb-error').hidden)return null;
  row('monthlyBasic',money(inputNumber('eosb-basic')));row('eligibleAllow',money(inputNumber('eosb-allow')));row('reason',t($('reason').value==='resign'?'resignReason':'fullReason'));
  [['eligibleWage','calc-wage'],['tenure','calc-tenure'],['firstFive','calc-first'],['afterFive','calc-after'],['resignFactor','calc-factor']].forEach(([key,id])=>row(key,$(id).textContent));row('estimatedBenefit',$('eosb-total').textContent+' '+t('sar'));
  if(!$('cliff').hidden)notes.push(t('cliffTitle')+': '+t('cliffDesc'));
  notes.push(t('eosbMethod'),t('wageNote'),t('exceptions'),t('calendar'));
 }else{
  [['passport','qPassport'],['probation','qProbation'],['basic','qBasic']].forEach(([key,label])=>row(label,t(answers[key]||'unanswered')));
  row('reviewStatus',$('audit-status').textContent);CHECKS.forEach(([key,label])=>row(label,t(checklist[key]?'verified':'notVerified')));hrQuestionKeys().forEach((key,i)=>rows.push([t('hrTitle')+' '+number(i+1,0),t(key)]));notes.push($('audit-summary').textContent,t('auditLimit'));
  if(answers.passport==='yes')notes.push(t('passportAlert')+' '+t('passportCite'));
  if(answers.probation==='yes')notes.push(t('probationAlert')+' '+t('probationCite'));
  if(answers.basic==='yes')notes.push(t('salaryAlert')+' '+t('salaryCite'));
 }
 return{title:t(activeTab+'Tab'),rows,notes};
}
function prepareReport(){
 const report=printMode==='hr'?hrReportData():reportData(),host=$('print-report');host.replaceChildren();host.dir=lang==='ar'?'rtl':'ltr';
 const node=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el};
 /* Embed a standalone copy of the vector mark: print hides the page's SVG definitions. */
 const brand=document.createElement('div');brand.className='report-brand';
 const logo=document.createElementNS('http://www.w3.org/2000/svg','svg');logo.setAttribute('viewBox','0 0 64 72');logo.setAttribute('class','report-logo');logo.setAttribute('aria-hidden','true');
 logo.innerHTML='<defs>'+$('emerald').outerHTML.replace('id="emerald"','id="report-emerald"')+'</defs>'+$('aqdlens-logo').innerHTML.replaceAll('url(#emerald)','url(#report-emerald)');
 brand.append(logo,node('h1','AqdLens • عقد لينس'));
 const independence=node('p','');independence.className='report-independence';independence.append(node('strong',t('independence')));
 host.append(brand,node('p',t('reportTitle')),node('p',t('generated')+': '+new Intl.DateTimeFormat(lang,{dateStyle:'medium',timeStyle:'short'}).format(new Date())),independence);
 if(!report){host.append(node('p',t('printInvalid')));return false;}
 host.append(node('h2',report.title));const table=document.createElement('table');
 report.rows.forEach(([label,value])=>{const tr=document.createElement('tr'),th=node('th',label),td=node('td',value);th.scope='row';tr.append(th,td);table.append(tr)});host.append(table);
 const notes=document.createElement('div');notes.className='report-notes';report.notes.forEach(text=>notes.append(node('p',text)));notes.append(node('p',t('statutory')),node('p',t('checked')),node('p',t('disclaimerRest')));
 [['sourceLabor','https://www.hrsd.gov.sa/en/علاقات-العمل'],['sourceOvertime','https://www.hrsd.gov.sa/en/شروط-العمل-وظروفه'],['sourcePassport','https://www.hrsd.gov.sa/en/labor-culture']].forEach(([key,url])=>{const a=node('a',t(key)+' · '+url);a.href=url;const p=document.createElement('p');p.append(a);notes.append(p)});host.append(notes);return true;
}
$('print-button').addEventListener('click',()=>{printMode='tool';const valid=prepareReport();$('print-status').hidden=valid;if(!valid){set('print-status',t('printInvalid'));return}window.print()});
window.addEventListener('beforeprint',prepareReport);
/* Feedback remains unsent until the visitor sends the email draft themselves. */
function feedbackText(){const message=$('feedback-message').value.trim();if(message.length<10||message.length>900){$('feedback-status').hidden=false;set('feedback-status',t('feedbackInvalid'));$('feedback-message').setAttribute('aria-invalid','true');$('feedback-message').focus();return null}$('feedback-message').setAttribute('aria-invalid','false');const key={bug:'feedbackBug',translation:'feedbackTranslation',suggestion:'feedbackSuggestion'}[$('feedback-type').value];return['AqdLens · '+t('feedbackTitle'),t('feedbackCategory')+': '+t(key),t('language')+': '+$('language').selectedOptions[0].textContent,'',message].join('\n')}
function feedbackStatus(key){set('feedback-status',t(key));$('feedback-status').hidden=false}
$('feedback-form').addEventListener('submit',e=>{e.preventDefault();const text=feedbackText();if(text===null)return;const draft='mailto:joemanuthomas@gmail.com?subject='+encodeURIComponent('AqdLens · '+t('feedbackTitle'))+'&body='+encodeURIComponent(text);window.location.href=draft;feedbackStatus('feedbackDraftOpened')});
$('copy-feedback').addEventListener('click',async()=>{const text=feedbackText();if(text===null)return;try{await navigator.clipboard.writeText(text);feedbackStatus('feedbackCopied')}catch(_){feedbackStatus('feedbackCopyFailed')}});
$('download-feedback').addEventListener('click',()=>{const text=feedbackText();if(text===null)return;const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='aqdlens-feedback.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);feedbackStatus('feedbackDownloaded')});

/* Optional browser WebMCP: uses the same validated calculation and visible inputs.
   Browsers without modelContext simply use the normal interface. */
if(document.modelContext?.registerTool){const lifetime=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'configure_eosb_estimate',description:'Set wage, completed years, months and separation reason in AqdLens, then return the estimated EOSB.',inputSchema:{type:'object',properties:{basic:{type:'number',minimum:0,maximum:10000000},allowances:{type:'number',minimum:0,maximum:10000000},years:{type:'integer',minimum:0,maximum:100},months:{type:'integer',minimum:0,maximum:11},reason:{type:'string',enum:['full','resign']}},required:['basic','allowances','years','months','reason'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!validWage(input.basic)||!validWage(input.allowances)||!Number.isInteger(input.years)||input.years<0||input.years>100||!Number.isInteger(input.months)||input.months<0||input.months>11||!['full','resign'].includes(input.reason))throw new Error('Invalid calculation input');$('eosb-basic').value=input.basic;$('eosb-allow').value=input.allowances;$('years').value=input.years;$('months').value=input.months;$('reason').value=input.reason;switchTab('eosb');updateEOSB();return calculateEOSB(input.basic+input.allowances,input.years,input.months,input.reason)}},{signal:lifetime.signal})).catch(()=>{});window.addEventListener('pagehide',()=>lifetime.abort(),{once:true})}catch(_){}}
</script>
